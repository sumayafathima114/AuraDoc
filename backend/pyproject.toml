[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "auradoc-api"
version = "0.1.0"
description = "AuraDoc Python API foundation"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "pypdf>=5,<7",
  "python-multipart>=0.0.20,<1",
  "python-dotenv>=1,<2",
  "uvicorn[standard]>=0.30,<1",
  "vosk>=0.3.45,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=0.24,<2"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
